name: Protect profile permissions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - supabase/migrations/20260923100000_protect_profile_permissions.sql
      - scripts/test-profile-permissions.sql
      - scripts/activate-profile-permissions.mjs
      - .github/workflows/protect-profile-permissions.yml
permissions:
  contents: read
concurrency:
  group: protect-profile-permissions
  cancel-in-progress: false
jobs:
  protect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Test permissions in disposable database
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-profile-permissions.sql
      - name: Apply tested permission protection
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_ID }}
        run: node scripts/activate-profile-permissions.mjs
