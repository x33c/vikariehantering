name: Apply Codex pass patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat .codex-patches/pass_forfragningar.part*.b64 > /tmp/codex.patch.b64
          base64 -d /tmp/codex.patch.b64 > /tmp/codex.patch
          echo "Patch files:"
          grep '^diff --git' /tmp/codex.patch || true
          echo "Trying 3-way patch apply..."
          if ! git apply --3way /tmp/codex.patch; then
            echo "3-way apply failed. Current rejected/conflicted files:"
            git status --short
            find . -name '*.rej' -print -maxdepth 5 || true
            exit 1
          fi
          git status --short
      - name: Verify build
        shell: bash
        run: |
          npm ci
          npm run build
      - name: Commit applied patch
        shell: bash
        run: |
          rm -rf .codex-patches
          rm -f .github/workflows/apply-codex-pass-forfragningar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api/index.ts src/types/index.ts src/pages/admin/Vikariepass.tsx src/pages/vikarie/LedigaPass.tsx src/pages/vikarie/MinaPass.tsx supabase/migrations/20260824090000_add_pass_forfragningar.sql .codex-patches .github/workflows/apply-codex-pass-forfragningar.yml
          git commit -m "pass: stöd flera förfrågningar och notisval"
          git push
